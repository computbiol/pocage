name: Publish pocage to PyPI

# PyPI Trusted Publisher settings for this workflow:
# - Owner: computbiol
# - Repository: pocage
# - Workflow file: .github/workflows/publish-pocage.yml
# - GitHub environment: pypi
# Release tags must use the form: pocage-v<version>

on:
  push:
    tags:
      - "pocage-v*"

permissions:
  contents: read

concurrency:
  group: publish-pocage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build package distributions
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: connector/pocage
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify tag matches package version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          package_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(pyproject["project"]["version"])
          PY
          )"

          expected_tag="pocage-v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}."
            echo "Expected tag: ${expected_tag}"
            exit 1
          fi

      - name: Install packaging tools
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        run: |
          set -euo pipefail
          rm -rf build dist pocage.egg-info
          python -m build

      - name: Check distribution metadata
        run: |
          set -euo pipefail
          python -m twine check dist/*

      - name: Smoke test wheel install
        run: |
          set -euo pipefail
          python -m venv /tmp/pocage-wheel
          /tmp/pocage-wheel/bin/pip install dist/*.whl

          (
            cd /tmp
            /tmp/pocage-wheel/bin/python - <<'PY'
          import pathlib

          import pocage

          module_path = pathlib.Path(pocage.__file__).resolve()
          if "site-packages" not in module_path.parts:
              raise SystemExit(f"wheel import did not resolve from site-packages: {module_path}")

          print(f"wheel import OK: {module_path}")
          PY
          )

          /tmp/pocage-wheel/bin/pocage --help >/dev/null

      - name: Smoke test sdist install
        run: |
          set -euo pipefail
          python -m venv /tmp/pocage-sdist
          /tmp/pocage-sdist/bin/pip install dist/*.tar.gz

          (
            cd /tmp
            /tmp/pocage-sdist/bin/python - <<'PY'
          import pathlib

          import pocage

          module_path = pathlib.Path(pocage.__file__).resolve()
          if "site-packages" not in module_path.parts:
              raise SystemExit(f"sdist import did not resolve from site-packages: {module_path}")

          print(f"sdist import OK: {module_path}")
          PY
          )

          /tmp/pocage-sdist/bin/pocage --help >/dev/null

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: pocage-dist
          path: |
            connector/pocage/dist/*.tar.gz
            connector/pocage/dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/pocage
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v5
        with:
          name: pocage-dist
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
